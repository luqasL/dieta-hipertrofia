<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>Dieta Hipertrofia</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b8579'/%3E%3Cpath d='M9.5 6.5v6a3 3 0 0 0 6 0v-6M12.5 6.5v19' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22.5 25.5V6.5c-3 1.5-3.8 6-3.8 9.5h3.8' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1a1c20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Casca global: fundo + um nível de superfície, sem borda em cada bloco. Cores dos macros só em marcas de dado (anel, barras, pontinhos). */
:root{
  --bg:#1a1c20;--surface:#23262b;--surface2:#2d3137;--line:#353a41;
  --fg:#eceef1;--mut:#9aa1ab;--accent:#5fcab8;--on-accent:#0a2421;
  --kcal:#ff9f5a;--prot:#ff7b7b;--carb:#5aa9ff;--fat:#f5c451;
  --okbg:#1e3832;--lowbg:#3d3322;--highbg:#432629;--overlay:rgba(8,10,12,.62);
  --okfg:#8fdcc6;--lowfg:#f0c77d;--highfg:#f4a3a3;
  --accent-soft:rgba(95,202,184,.15);--nav-bg:rgba(35,38,43,.88);
  --shadow:none;--shadow-pop:0 16px 48px rgba(0,0,0,.5);
  --r:18px;--r-sm:12px;
  --fs-1:28px;--fs-2:20px;--fs-3:16px;--fs-4:14px;--fs-5:12px;
  --f-display:"Space Grotesk",system-ui,sans-serif;--f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f1f2f4;--surface:#ffffff;--surface2:#eef0f3;--line:#e2e5e9;
  --fg:#15181c;--mut:#5f6670;--accent:#0b8579;--on-accent:#ffffff;
  --kcal:#c65f14;--prot:#d03a3a;--carb:#2a72cc;--fat:#9a7000;
  --okbg:#dcf1ea;--lowbg:#f9edd6;--highbg:#fae3e3;--overlay:rgba(21,24,28,.42);
  --okfg:#0b6b5c;--lowfg:#875800;--highfg:#b13333;
  --accent-soft:rgba(11,133,121,.11);--nav-bg:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(21,24,28,.04),0 4px 16px rgba(21,24,28,.045);--shadow-pop:0 16px 48px rgba(21,24,28,.18);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f1f2f4;--surface:#ffffff;--surface2:#eef0f3;--line:#e2e5e9;
  --fg:#15181c;--mut:#5f6670;--accent:#0b8579;--on-accent:#ffffff;
  --kcal:#c65f14;--prot:#d03a3a;--carb:#2a72cc;--fat:#9a7000;
  --okbg:#dcf1ea;--lowbg:#f9edd6;--highbg:#fae3e3;--overlay:rgba(21,24,28,.42);
  --okfg:#0b6b5c;--lowfg:#875800;--highfg:#b13333;
  --accent-soft:rgba(11,133,121,.11);--nav-bg:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(21,24,28,.04),0 4px 16px rgba(21,24,28,.045);--shadow-pop:0 16px 48px rgba(21,24,28,.18);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:var(--fs-2);font-weight:700}h2{font-size:var(--fs-3)}h3{font-size:var(--fs-4)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:16px;min-width:0}
.shell{gap:20px}
.shell>main{margin:0;width:100%}
.wrap .wrap{margin:0}
/* cabeçalho */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap}
.top h1+.mut{margin-top:3px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-5);font-weight:500;color:var(--mut);background:var(--surface);box-shadow:var(--shadow);border-radius:99px;padding:5px 11px 5px 10px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
/* texto e superfícies */
.mut{color:var(--mut);font-size:13px}
.eyebrow{font-size:13px;font-weight:500;color:var(--mut)}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
/* botões */
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);color:var(--fg);border:0;border-radius:var(--r-sm);
  padding:10px 16px;min-height:42px;font-size:var(--fs-4);font-weight:600;line-height:1.2;transition:background-color .15s,filter .15s}
.btn:hover{background:color-mix(in srgb,var(--surface2),var(--fg) 7%)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.x{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:0;border-radius:10px}
.x:hover{background:var(--surface2);color:var(--fg)}
.x svg{width:18px;height:18px}
/* formulários */
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:14px 0 6px}
input{width:100%;min-width:0;background:var(--surface2);color:var(--fg);border:1px solid transparent;border-radius:var(--r-sm);padding:11px 13px;
  font:inherit;font-size:16px;transition:border-color .15s,background-color .15s,box-shadow .15s}
input::placeholder{color:var(--mut);opacity:.8}
input:focus,input:focus-visible{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number]{font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.g2>*{min-width:0}
/* selo da fonte do alimento (TACO, USDA, Rótulo…) */
.src{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);
  background:color-mix(in srgb,var(--fg) 7%,transparent);border-radius:5px;padding:1px 5px;line-height:1.5;vertical-align:1px}
/* status (Dentro / Abaixo / Acima) */
.pill{display:inline-block;font-size:var(--fs-5);font-weight:600;text-align:center;border-radius:99px;padding:3px 10px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--okfg)}.pill.low{background:var(--lowbg);color:var(--lowfg)}.pill.high{background:var(--highbg);color:var(--highfg)}
.aibox{background:var(--surface2);border-radius:14px;padding:14px;margin-top:12px;font-size:var(--fs-4)}
/* macros em linha: número neutro + pontinho na cor do macro (mesma cor do anel e das barras) */
.macs{display:inline;font-variant-numeric:tabular-nums}
.mc{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;margin-right:10px}.mc:last-child{margin-right:0}
.md{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;background:var(--c,var(--mut))}
.md-k{background:var(--kcal)}.md-p{background:var(--prot)}.md-c{background:var(--carb)}.md-g{background:var(--fat)}
.c-kcal{color:var(--kcal)}.c-prot{color:var(--prot)}.c-carb{color:var(--carb)}.c-fat{color:var(--fat)}
/* barra de abas: embaixo no celular, segmentada no topo no desktop */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--nav-bg);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav button{flex:1;max-width:140px;background:none;border:0;border-radius:12px;padding:2px 0;color:var(--mut);font-size:var(--fs-5);font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;padding:4px 18px;box-sizing:content-box;border-radius:99px;transition:background-color .2s}
nav button.on{color:var(--fg)}
nav button.on svg{background:var(--accent-soft);color:var(--accent)}
/* janela de adicionar alimento */
.modal{position:fixed;inset:0;z-index:9;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:24px 24px 0 0;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;box-shadow:var(--shadow-pop);
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:sheet-in .22s ease-out}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
@keyframes sheet-in{from{transform:translateY(28px);opacity:.5}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-h h2{font-size:var(--fs-2);margin-top:2px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search input{padding-left:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-height:212px;overflow:auto;padding:2px}
.chips-hint{width:100%;font-size:13px;color:var(--mut);margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;background:var(--surface2);color:var(--fg);border:1px solid transparent;border-radius:99px;padding:7px 13px;font-size:var(--fs-4);text-align:left;line-height:1.3}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.pv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:14px 0;text-align:center;background:var(--line);border-radius:14px;overflow:hidden}
.pv>div{background:var(--surface2);padding:10px 4px 9px;font-size:var(--fs-5);color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pv b{display:block;font-size:var(--fs-2);font-weight:600;line-height:1.15;color:var(--fg)}
.pv b.c-kcal{color:var(--kcal)}.pv b.c-prot{color:var(--prot)}.pv b.c-carb{color:var(--carb)}.pv b.c-fat{color:var(--fat)}
.pv>div>span{display:inline-flex;align-items:center;gap:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--fg);color:var(--bg);
  padding:11px 18px;border-radius:99px;font-size:var(--fs-4);font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow-pop);animation:toast-in .2s ease-out}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}}
@media (min-width:820px){
  body{padding-block:32px 56px}
  .shell{grid-template-columns:minmax(0,1fr) auto;column-gap:24px;row-gap:28px;align-items:center}
  .shell>main{grid-column:1/-1}
  .top{justify-content:flex-start;gap:12px 18px}
  h1{font-size:22px}
  .card{padding:22px}
  nav{position:static;grid-column:2;grid-row:1;display:inline-flex;gap:2px;padding:4px;background:var(--surface);border:0;border-radius:14px;box-shadow:var(--shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
  nav button{flex:none;max-width:none;flex-direction:row;gap:8px;padding:8px 16px;font-size:var(--fs-4);border-radius:10px}
  nav button svg{width:18px;height:18px;padding:0}
  nav button:hover:not(.on){color:var(--fg)}
  nav button.on{background:var(--accent-soft)}
  nav button.on svg{background:none}
  .modal{align-items:center;padding:24px}
  .sheet{border-radius:24px;max-height:min(780px,90vh);padding:22px 24px 24px}
  .sheet::before{display:none}
  .toast{bottom:32px}
}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}.btn,input,nav button svg{transition:none}}
/* ---- regras antigas das abas (as abas podem substituir nos seus blocos) ---- */
.datebar{display:flex;justify-content:space-between;align-items:center}
.datebar button{width:40px;height:40px;border:0;border-radius:12px;background:var(--surface2);font-size:20px}
.datebar b{font-family:var(--f-display);font-size:17px}
.hero{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:132px;aspect-ratio:1;max-width:100%}
.ring svg{display:block;width:100%;height:100%}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:28px;font-weight:700;line-height:1}
.bars{display:grid;gap:10px}
.bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.bar .t span:first-child{display:flex;align-items:center;gap:6px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%}
.tr{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.fi{height:100%;border-radius:99px;transition:width .4s}
.left{margin-top:4px;font-size:14px}.left b{color:var(--fg)}
.meals{display:grid;gap:14px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.it>div{min-width:0}.it small{color:var(--mut);display:block;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);font-size:13px;padding:6px 0 2px}
@media (min-width:820px){.meals{grid-template-columns:1fr 1fr}.hero{grid-template-columns:170px minmax(0,1fr)}.ring{width:170px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}}
.cols{display:grid;gap:14px}
.status{border-radius:12px;padding:14px;font-size:15px}
.ok{background:var(--okbg)}.low{background:var(--lowbg)}.high{background:var(--highbg)}.neu{background:var(--surface2)}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--mut);font-size:11px;font-family:var(--f-body)}
.wk{display:grid;gap:8px}
.wkr{display:grid;grid-template-columns:10px minmax(0,1fr) auto 72px;align-items:center;gap:10px;font-size:14px}
.wkr .num{color:var(--mut)}.wkr .num b{color:var(--fg)}
.dicas{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.meal-h{flex-wrap:wrap}.mline{font-size:13px;font-weight:600}.it small .c-kcal,.it small .c-prot,.it small .c-carb,.it small .c-fat{font-weight:600}.qty{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.fi{transition:none}}
/* == HOJE CSS == */
/* Hoje: um único painel (resumo do dia); o resto se agrupa por títulos, espaço e linhas finas */
.h-page{display:grid;gap:22px;min-width:0}
.h-num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.h-date{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h-date-t{text-align:center;min-width:0}
.h-date-t b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.h-date-t span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.h-ico{width:40px;height:40px;flex:none;display:inline-grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--fg)}
.h-ico:hover{background:var(--surface2)}
.h-ico svg{width:20px;height:20px}
.h-grid{display:grid;gap:30px;min-width:0}
.h-sum{background:var(--surface);border-radius:20px;padding:18px;min-width:0}
.h-sum-top{display:grid;grid-template-columns:118px minmax(0,1fr);gap:20px;align-items:center}
.h-ring{position:relative;width:100%;aspect-ratio:1}
.h-ring svg{display:block;width:100%;height:100%}
.h-ring-l{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.h-ring-n{font-size:28px;font-weight:700;line-height:1}
.h-ring-g{font-size:12px;color:var(--mut);margin-top:4px}
.h-bars{display:grid;gap:13px;min-width:0}
.h-bar-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:6px}
.h-bar-l{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.h-bar-v{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}
.h-bar-v b{color:var(--fg);font-weight:600}
.h-track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.h-fill{height:100%;border-radius:99px;transition:width .4s}
.h-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.h-left{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.h-left b{color:var(--fg);font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600}
.h-sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.h-sec-h h2{font-family:var(--f-display);font-size:16px;font-weight:600}
.h-sec-h span{font-size:12px;color:var(--mut);white-space:nowrap}
.h-wkr{display:grid;grid-template-columns:8px minmax(0,1fr) auto 66px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.h-wkr .h-v{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;white-space:nowrap}
.h-wkr .h-v b{color:var(--fg);font-size:15px;font-weight:600}
.h-st{font-size:11px;font-weight:600;text-align:center;border-radius:99px;padding:3px 0;color:var(--fg)}
.h-st-ok{background:var(--okbg)}.h-st-low{background:var(--lowbg)}.h-st-high{background:var(--highbg)}
.h-tips{margin-top:16px;padding-left:12px;border-left:2px solid var(--accent)}
.h-tips h3{font-family:var(--f-display);font-size:14px;font-weight:600;margin-bottom:6px}
.h-tips ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.h-tips li,.h-tips p{margin:0;font-size:14px;line-height:1.5;color:var(--mut)}
.h-tips b{color:var(--fg);font-weight:600}
.h-note{margin:12px 0 0;font-size:12px;line-height:1.5;color:var(--mut)}
.h-wk-empty{margin:12px 0 0;font-size:14px;color:var(--mut)}
.h-meal{padding:14px 0;border-bottom:1px solid var(--line)}
.h-meal.is-empty{padding:8px 0}
.h-meal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.h-meal-tt{min-width:0}
.h-meal-n{font-family:var(--f-display);font-size:16px;font-weight:600}
.h-meal.is-empty .h-meal-n{font-size:15px;font-weight:500;color:var(--mut)}
.h-meal-s{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:1px}
.h-meal-s b{color:var(--fg);font-weight:600}

/* == PESO CSS == */

.p-st-h h3{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0}
.p-rate{font-family:var(--f-display);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-rate small{font-size:12px;font-weight:500;color:var(--mut)}
.p-status p{margin:12px 0 0;font-size:14px;line-height:1.5}
.p-status .btn{margin-top:14px}
.p-gauge{margin-top:14px}

/* == AJUSTES CSS == */
/* Ajustes: seções sem moldura, separadas por espaço e linha fina; o único painel é o quadro das metas calculadas */
.a-page{display:grid;gap:28px;min-width:0}

.a-m .a-how{display:block;font-size:12px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.a-base{margin:14px 0 0;font-size:13px;color:var(--mut)}
.a-base b{color:var(--fg);font-weight:600}

.a-edit{margin-top:20px}

.a-f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.a-f4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}

.a-f3 label,.a-f4 label,.a-new label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-act{margin-top:14px}
.a-note{margin:12px 0 0;font-size:13px;color:var(--mut);max-width:52ch}

}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  let d=null;try{d=await window.claude.use('db')}catch(e){}
  if(!d)return;
  db=d;S={goals:{...DEF_GOALS},foods:[],days:{},weights:{}};
  setSync('Sincronizando…');render();
  let got=0;const done=()=>{if(++got>=3){clearTimeout(timer);setSync('Sincronizado em todos os aparelhos')}};
  const timer=setTimeout(()=>setSync('Sem conexão: os dados podem estar desatualizados'),10000);
  const fail=()=>{clearTimeout(timer);setSync('Não foi possível carregar os dados')};
  let a=false,b=false,c=false;
  db.doc('config/main').onSnapshot(s=>{const v=s.data();S.goals=(v&&v.goals)||{...DEF_GOALS};S.foods=(v&&v.foods)||[];
    if(!s.metadata.fromCache&&!a){a=true;done()}render()},fail);
  db.collection('days').onSnapshot(q=>{const o={};q.docs.forEach(x=>{o[x.id]=(x.data()||{}).meals||{}});S.days=o;
    if(!q.metadata.fromCache&&!b){b=true;done()}render()},fail);
  db.collection('weights').onSnapshot(q=>{const o={};q.docs.forEach(x=>{const v=x.data();if(v&&typeof v.kg==='number')o[x.id]=v.kg});S.weights=o;
    if(!q.metadata.fromCache&&!c){c=true;done()}render()},fail);
}

function search(q){const t=norm(q).split(/[\s,]+/).filter(Boolean);if(!t.length)return null;

const macs=(m,dec)=>{const f=dec?r1:r0;return `<span class="macs"><span class="mc"><i class="md md-k"></i>${r0(m.k)} kcal</span><span class="mc"><i class="md md-p"></i>P ${f(m.p)} g</span><span class="mc"><i class="md md-c"></i>C ${f(m.c)} g</span><span class="mc"><i class="md md-g"></i>G ${f(m.g)} g</span></span>`};

function mac(e){const f=food(e.f),x=e.g/100;return{k:f.k*x,p:f.p*x,c:f.c*x,g:f.g*x}}
function sum(a){return a.reduce((t,e)=>{const m=mac(e);t.k+=m.k;t.p+=m.p;t.c+=m.c;t.g+=m.g;return t},{k:0,p:0,c:0,g:0})}
function lastKg(){const W=Object.entries(S.weights||{}).sort((a,b)=>a[0]<b[0]?1:-1);return W.length?W[0][1]:null}
function goals(){const s=S.goals||{},k=s.k||DEF_GOALS.k,pkg=s.pkg||DEF_GOALS.pkg,gkg=s.gkg||DEF_GOALS.gkg,kg=lastKg()||BASE_KG;
  const p=Math.round(kg*pkg),g=Math.round(kg*gkg),c=Math.max(0,Math.round((k-p*4-g*9)/4));return{k,p,c,g,pkg,gkg,kg,measured:lastKg()!=null}}

  if(!dias.length)return null;const a={k:0,p:0,c:0,g:0};dias.forEach(s=>{for(const x in a)a[x]+=s[x]/dias.length});return{n:dias.length,a}}

  const bx0=X(0),bx1=X(span),up=Y(w0+mo),dn=Y(w0+mo/2),y0=Y(w0);
  const band=`<polygon points="${f(bx0)},${f(y0)} ${f(bx1)},${f(up)} ${f(bx1)},${f(dn)}" fill="var(--accent)" fill-opacity=".16"/>
  <polyline points="${f(bx1)},${f(up)} ${f(bx0)},${f(y0)} ${f(bx1)},${f(dn)}" fill="none" stroke="var(--accent)" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 4"/>`;
  const pts=W.map(x=>({x:X((pd(x.d)-t0)/864e5),y:Y(x.kg),d:x.d,kg:x.kg})),last=pts[pts.length-1];
  /* rótulos de data: só nas pesagens, sem encavalar; a última sempre aparece */
  const lab=[];for(const p of pts){if(!lab.length||p.x-lab[lab.length-1].x>=54)lab.push(p);else if(p===last)lab[lab.length-1]=p}
  const xl=lab.map(p=>`<line x1="${f(p.x)}" x2="${f(p.x)}" y1="${h-B}" y2="${h-B+4}" stroke="var(--line)"/><text x="${f(p.x)}" y="${h-B+18}" text-anchor="${p.x<L+20?'start':p.x>w-R-20?'end':'middle'}">${pd(p.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>`).join('');
  const ly=last.y-16<12?last.y+26:last.y-16,la=last.x>w-R-34?'end':last.x<L+34?'start':'middle';
  el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de peso: de ${pKg(w0)} kg em ${pDm(W[0].d)} para ${pKg(last.kg)} kg em ${pDm(last.d)}">${g}${band}
  <polyline points="${pts.map(p=>f(p.x)+','+f(p.y)).join(' ')}" fill="none" stroke="var(--kcal)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.slice(0,-1).map(p=>`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="3.5" fill="var(--bg)" stroke="var(--kcal)" stroke-width="2"/>`).join('')}
  <circle cx="${f(last.x)}" cy="${f(last.y)}" r="11" fill="var(--kcal)" fill-opacity=".18"/><circle cx="${f(last.x)}" cy="${f(last.y)}" r="5.5" fill="var(--kcal)" stroke="var(--bg)" stroke-width="2"/>
  <text class="p-end" x="${f(last.x)}" y="${f(ly)}" text-anchor="${la}">${pKg(last.kg)} kg</text>${xl}</svg>`}
let pRz;addEventListener('resize',()=>{clearTimeout(pRz);pRz=setTimeout(()=>{if(tab==='peso'&&document.getElementById('chart'))drawChart()},150)});

/* ---------- ajustes ---------- */
const aInp=(id,l,v,st)=>`<div><label for="${id}">${l}</label><input id="${id}" type="number" inputmode="decimal" step="${st||1}" value="${v??''}"></div>`;
const aSw=col=>`<i class="a-sw" style="background:var(${col})" aria-hidden="true"></i>`;
const aX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function aFood(f){const v=(col,l,x)=>`<span>${aSw(col)}<b>${x}</b> ${l}</span>`;
  return `<li class="a-row"><div><div class="a-name">${esc(f.n)} ${badge(f.src||'Você')}</div>
  <div class="a-vals">${v('--kcal','kcal',r0(f.k))}${v('--prot','prot',br(f.p))}${v('--carb','carb',br(f.c))}${v('--fat','gord',br(f.g))}<span>por 100 g</span></div></div>
  <button class="a-del" aria-label="Remover ${esc(f.n)}" onclick="delF('${f.id}')">${aX}</button></li>`}
function vAjustes(){const G=goals(),kg=br(G.kg),F=S.foods||[];
  const m=(col,l,v,how)=>`<div class="a-m"><div class="a-cap">${aSw(col)}${l}</div><div class="a-v a-num">${v}<small>g</small></div><span class="a-how">${how}</span></div>`;
  return `<div class="a-page">
  <header class="a-intro"><h2>Ajustes</h2><p>Quanto comer por dia e os alimentos que você mesmo cadastrou.</p></header>

  <section class="a-sec" aria-labelledby="a-h-metas">
    <div class="a-sh"><h3 id="a-h-metas">Metas diárias</h3><p>O que a aba Hoje usa para medir o seu dia.</p></div>
    <div class="a-goals">
      <div class="a-cap">${aSw('--kcal')}Calorias por dia</div>
      <div class="a-kcal"><span class="a-big a-num">${G.k}</span><span class="a-u">kcal</span></div>
      <div class="a-macros">
        ${m('--prot','Proteína',G.p,`${br(G.pkg)} g × ${kg} kg`)}
        ${m('--carb','Carboidrato',G.c,'o resto das kcal')}
        ${m('--fat','Gordura',G.g,`${br(G.gkg)} g × ${kg} kg`)}
      </div>
      <p class="a-base">Calculado com <b class="a-num">${kg} kg</b>, ${G.measured?'sua última pesagem':'o peso inicial (até a primeira pesagem)'}.</p>
    </div>
    <p class="a-note">Proteína e gordura acompanham seu peso sozinhas. As calorias mudam quando você aplica o ajuste sugerido na aba Peso.</p>
    <div class="a-edit">
      <h4>Mudar as metas</h4>
      <div class="a-f3">${aInp('gk','Calorias (kcal)',G.k)}${aInp('gpk','Proteína g/kg',G.pkg,0.1)}${aInp('ggk','Gordura g/kg',G.gkg,0.1)}</div>
      <div class="a-act"><button class="btn pri full" onclick="saveG()">Salvar metas</button></div>
    </div>
  </section>

  <section class="a-sec" aria-labelledby="a-h-alim">
    <div class="a-sh"><h3 id="a-h-alim">Meus alimentos</h3><p>Para produtos de marca, como whey ou Danoninho. Copie os valores por 100 g do rótulo.</p></div>
    ${F.length?`<ul class="a-list">${F.map(aFood).join('')}</ul>`:'<p class="a-empty">Nenhum alimento cadastrado ainda. Os que você buscar com o Claude também aparecem aqui.</p>'}
    <div class="a-new">
      <h4>Cadastrar alimento</h4>
      <label for="fn">Nome</label><input id="fn" placeholder="Ex.: Whey concentrado">
      <div class="a-f4">${aInp('fk','Calorias (kcal)')}${aInp('fp','Proteína (g)')}${aInp('fc','Carboidrato (g)')}${aInp('fg','Gordura (g)')}</div>
      <div class="a-f2">${aInp('fd','Porção padrão (g)',100)}</div>
      <div class="a-act"><button class="btn pri full" onclick="addF()">Cadastrar alimento</button></div>
    </div>
  </section>

  <section class="a-sec a-about" aria-labelledby="a-h-dados">
    <h3 id="a-h-dados">Sobre os dados</h3>
    <dl>
      <div><dt>TACO</dt><dd>Tabela completa, NEPA/Unicamp, 4ª ed., 2011.</dd></div>
      <div><dt>USDA</dt><dd>Seleção da base SR28 para o que a TACO não traz, como macarrão cozido, whey, atum e iogurte grego.</dd></div>
    </dl>
    <p>Os valores são médias por 100 g. Para produtos de marca, o rótulo é o mais exato. A etiqueta ao lado de cada alimento mostra a fonte.</p>
  </section>
  </div>`}
function saveG(){const v=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'))||0;const g={k:Math.round(v('gk')),pkg:v('gpk'),gkg:v('ggk')};
  if(!g.k)return toast('Digite a meta de calorias.');if(!g.pkg||!g.gkg)return toast('Preencha proteína e gordura por kg.');S.goals=g;saveConfig();render();toast('Metas salvas')}
function addF(){const v=id=>parseFloat(document.getElementById(id).value)||0,n=document.getElementById('fn').value.trim();if(!n)return toast('Dê um nome ao alimento.');
  S.foods=[...(S.foods||[]),{id:'c'+Date.now(),n,k:v('fk'),p:v('fp'),c:v('fc'),g:v('fg'),d:v('fd')||100}];saveConfig();render();toast('Alimento cadastrado')}
function delF(id){S.foods=(S.foods||[]).filter(f=>f.id!==id);saveConfig();render()}

let tt;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2400)}

(function(){let has=false;try{has=!!localStorage.getItem(LSKEY)}catch(e){}if(!has){S=Object.assign(S,JSON.parse(JSON.stringify(SEED)));lsSave()}})();
lsLoad();render();connect();
(async()=>{try{if(window.claude&&window.claude.use)sampleFn=await window.claude.use('sample')}catch(e){}})();
